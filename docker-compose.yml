services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=apipoc
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apipoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ADDR=:8080
      - AZURE_ISSUER=${AZURE_ISSUER}
      - AZURE_AUDIENCE=${AZURE_AUDIENCE}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/apipoc?sslmode=disable
      # Export OTLP to the .NET Aspire dashboard running on the host.
      - OTEL_EXPORTER=otlp
      - OTEL_EXPORTER_ENDPOINT=host.docker.internal:18889
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  outbox-relay:
    build:
      context: .
      dockerfile: cmd/outbox-relay/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/apipoc?sslmode=disable
      - OTEL_EXPORTER=otlp
      - OTEL_EXPORTER_ENDPOINT=host.docker.internal:18889
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
